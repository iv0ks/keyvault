services:
  # Open-source HTTP reverse proxy and load balancer designed for cloud-native infrastructure.
  traefik:
    image: 'traefik:v3.7.14' # Use a specific, stable version for reliability.
    container_name: 'traefik'
    security_opt:
      - 'no-new-privileges:true' # Hardening: no setuid/setgid elevation.
    deploy:
      resources:
        limits:
          memory: 256M # Traefik is efficient; 256MB is plenty.
    env_file:
      - path: .env
        required: false
    volumes:
      - ${ROOT_PATH:-.}/tools/traefik:/etc/traefik # Mount config directory (GitOps ready).
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only access for service discovery.
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - iv0ks-dev
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.dashboard.tls.certresolver=namecheap'
      - 'traefik.http.routers.dashboard.tls.domains[0].main=*.iv0ks.dev'
      - 'traefik.http.routers.dashboard.tls.domains[0].sans=iv0ks.dev'
      - 'traefik.http.routers.dashboard.service=api@internal'
      - 'traefik.http.routers.dashboard.rule=Host(`traefik.iv0ks.dev`)'
      - 'traefik.http.routers.dashboard.entrypoints=websecure'
      - 'traefik.http.routers.dashboard.tls=true'

  # Lab's database. The app waits for this to be *healthy* (not just started) before it migrates and seeds,
  # so there is no startup race: `docker compose up -d` brings the whole lab up in one command.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyvault}
      POSTGRES_DB: ${POSTGRES_DB:-keyvault}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # pg_isready returns 0 only once Postgres is accepting connections.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-keyvault} -d ${POSTGRES_DB:-keyvault}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iv0ks-dev

  # keyvault — the intentionally vulnerable secrets-sharing API (read IDOR on
  # UUID-keyed resources, CWE-639). The entrypoint migrates + seeds, then starts
  # the server.
  keyvault:
    image: ghcr.io/iv0ks/keyvault:latest
    build:
      context: .
      args:
        FLAG: ${FLAG:-FLAG{KEYVAULT_GUESSING_NOT_REQUIRED}}
    container_name: keyvault
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - '3000:3000'
    networks:
      - iv0ks-dev
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.keyvault.rule=Host(`keyvault.iv0ks.dev`)'
      - 'traefik.http.routers.keyvault.entrypoints=websecure'
      - 'traefik.http.routers.keyvault.tls=true'
      - 'traefik.http.routers.keyvault.tls.certresolver=namecheap'
      - 'traefik.http.services.keyvault.loadbalancer.server.port=3000'

# Persistent volumes.
volumes:
  postgres-data:

# This network must be created once with `docker network create iv0ks-dev` before bringing the stack up.
networks:
  iv0ks-dev:
    external: true
